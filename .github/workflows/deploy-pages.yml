name: Deploy ProgressXX Full App
on:
  push:
    branches: [main]
    paths:
      - tests/release-ci-workflow-contract.cjs
      - scripts/release-ci-gate.cjs
      - tests/release-ci-gate.cjs
      - index.html
      - full-app.html
      - commercial-v1.html
      - manifest.webmanifest
      - sw.js
      - icon-192.svg
      - icon-512.svg
      - .github/workflows/deploy-pages.yml
      - scripts/smoke-full-ui.cjs
      - tests/login-optional-render-recovery.cjs
      - tests/login-imported-archive-regression.cjs
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify database experiments remain paused
        run: node tests/database-experiments-paused.cjs
      - name: Require successful validation of this artifact commit
        uses: actions/github-script@v7
        with:
          script: |
            const { waitForValidation } = require('./scripts/release-ci-gate.cjs');
            await waitForValidation({
              sha: context.sha,
              repository: `${context.repo.owner}/${context.repo.repo}`,
              log: message => core.info(message),
              listRuns: async workflow => {
                const response = await github.rest.actions.listWorkflowRuns({
                  ...context.repo, workflow_id: workflow, branch: 'main',
                  head_sha: context.sha, per_page: 100
                });
                return response.data.workflow_runs;
              }
            });
      - name: Validate full application code and block private Google integrations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          cp index.html full-app.html commercial-v1.html manifest.webmanifest sw.js icon-192.svg icon-512.svg site/
          touch site/.nojekyll
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const html=fs.readFileSync('site/index.html','utf8');
          for(const id of ['home','log','analytics','nutrition','daily','calculators','settings','intelligence','pxCommercialGate']){
            assert(html.includes('id="'+id+'"'),'Missing screen '+id);
          }
          assert(!/https:\/\/script\.google\.com\/macros\/s\//i.test(html),'Private Google Apps Script URL found');
          assert(!/https:\/\/docs\.google\.com\/spreadsheets\/d\//i.test(html),'Private spreadsheet URL found');
          assert(!/AKfycb[A-Za-z0-9_-]{25,}/.test(html),'Potential Apps Script deployment key found');
          assert(!/service_role[\s"':=]/i.test(html),'Possible privileged API secret');
          const scripts=[...html.matchAll(/<script(?:\s+[^>]*)?>([\s\S]*?)<\/script>/g)];
          assert(scripts.length>=3,'Missing original scripts');
          for(const script of scripts)new vm.Script(script[1]);
          assert(html.includes('user_app_snapshots'),'Missing account-scoped Supabase synchronization');
          console.log('Full ProgressXX: all screens, scripts, auth and privacy checks passed');
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Required mobile browser integration test
        run: |
          python3 -m http.server 8765 > /tmp/progressxx-test-server.log 2>&1 &
          sleep 2
          node scripts/smoke-full-ui.cjs
      - name: Required login render isolation regression
        run: node tests/login-optional-render-recovery.cjs
      - name: Required restored Food and Daily account login regression
        run: node tests/login-imported-archive-regression.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
