name: Deploy ProgressXX Commercial Preview
on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify public preview contains no private app configuration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          cp index.html site/index.html
          touch site/.nojekyll
          if grep -Eqi 'script.google.com|progressx-data-v19|service_role|DB_PASSWORD' site/index.html; then
            echo 'Potential private configuration found; blocking deployment'
            exit 1
          fi
      - name: Validate inline JavaScript
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const html=fs.readFileSync('index.html','utf8');
          const start=html.indexOf('<script>'),end=html.indexOf('</script>',start);
          assert(start!==-1 && end>start,'Missing inline script');
          const scripts=[html.slice(start+8,end)];
          assert(scripts.length>0,'Missing script');
          for(const script of scripts) new vm.Script(script);
          for(const id of ['authForm','signedIn','dashboard','weightForm','workoutForm'])assert(html.includes('id="'+id+'"'),'Missing '+id);
          console.log('Commercial auth and dashboard syntax/element checks passed');
          NODE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
