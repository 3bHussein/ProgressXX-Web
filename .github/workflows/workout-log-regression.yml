name: Workout Log Chromium regression
on:
  pull_request:
    paths:
      - 'index.html'
      - 'tests/workout-empty-training-day.cjs'
      - '.github/workflows/workout-log-regression.yml'
  workflow_dispatch:

jobs:
  workout-log-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium test dependency
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local web server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/progressxx-test-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/index.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/progressxx-test-server.log
          exit 1
      - name: Workout Log save and refresh regression
        run: node tests/workout-empty-training-day.cjs
