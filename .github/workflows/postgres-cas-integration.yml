name: Isolated PostgreSQL CAS integration
on:
  push:
    branches: [main]
    paths:
      - 'tests/postgres-cas-isolated.sql'
      - 'tests/postgres-cas-concurrency.py'
      - 'tests/postgres-owner-cas-fixture.sql'
      - 'tests/postgres-owner-cas-acceptance.py'
      - 'tests/postgres-owner-cas-guard.py'
      - 'index.html'
      - '.github/workflows/postgres-cas-integration.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  synthetic-cas:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: synthetic_cas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d synthetic_cas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated runner refuses production targets
        run: python3 tests/postgres-owner-cas-guard.py
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Verify synthetic PostgreSQL CAS and deletion protection
        env:
          PGPASSWORD: test-only
        run: |
          psql -h localhost -U postgres -d synthetic_cas -v ON_ERROR_STOP=1 -f tests/postgres-cas-isolated.sql
          echo 'Only disposable PostgreSQL tested. Supabase production CAS is NOT deployed.'
      - name: Verify independent-session PostgreSQL CAS races
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGDATABASE: synthetic_cas
          PGPASSWORD: test-only
        run: python3 tests/postgres-cas-concurrency.py
      - name: Verify owner CAS, RLS, legacy-write lockout and database restore
        env:
          PG_DUMP_CONTAINER: ${{ job.services.postgres.id }}
          PGHOST: localhost
          PGUSER: postgres
          PGDATABASE: synthetic_cas
          PGPASSWORD: test-only
        run: python3 tests/postgres-owner-cas-acceptance.py
