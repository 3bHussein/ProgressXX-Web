      - tests/mobile-motion-anatomy-accessibility.cjs
      - tests/mobile-barcode-keyboard-rtl-browser.cjs
      - tests/pwa-install-permission-recovery-browser.cjs
      - .github/workflows/cross-browser-ui.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cross-browser-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    env:
      PX_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify database experiments remain paused
        run: node tests/database-experiments-paused.cjs
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Root UI with local fixtures and no account login
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/cross-browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/index.html -o /dev/null; then break; fi
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:8765/index.html -o /dev/null
          node tests/mobile-motion-anatomy-accessibility.cjs
          node tests/mobile-barcode-keyboard-rtl-browser.cjs
          node tests/pwa-install-permission-recovery-browser.cjs
          node tests/barcode-lazy-library-browser.cjs
          node tests/workout-log-incremental-browser.cjs
          node tests/workout-log-keyboard-browser.cjs
          node tests/workout-chronology-deload-contract.cjs
          node tests/v3-structured-session-contract.cjs
          node tests/session-mixed-performance-browser.cjs
          node tests/food-priority-collapse-browser.cjs
          node tests/food-weight-browsing-browser.cjs
          node tests/mobile-all-pages-design-browser.cjs
          node tests/weekly-weight-usual-foods-browser.cjs
          node tests/food-workflow-tools-browser.cjs
          node tests/food-undo-save-status-browser.cjs
          node tests/practical-weekly-progress-browser.cjs
          node tests/session-drafts-repeat-meals-browser.cjs
          node tests/home-action-hub-browser.cjs
          node tests/simple-insights-coaching-browser.cjs
          node tests/compact-food-navigation-browser.cjs
          node tests/daily-progress-focus-browser.cjs
          node tests/insights-evidence-actions-browser.cjs
          node tests/backup-download-import-browser.cjs
          node tests/v3-mobile-diary-browser.cjs
          node tests/settings-language-pages-browser.cjs
          node tests/searchable-choice-picker-browser.cjs
          node tests/routine-builder-browser.cjs
          node tests/training-day-manager-browser.cjs
          node tests/food-portions-after-refresh-browser.cjs
          node tests/logout-dialog-policy-browser.cjs
          node tests/navigation-current-page-browser.cjs
          node tests/insights-anatomy-controls-browser.cjs
          node tests/insights-panel-recovery-browser.cjs
          node tests/diagnostics-redaction-browser.cjs
