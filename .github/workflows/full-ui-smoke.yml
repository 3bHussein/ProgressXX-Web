name: Full ProgressXX migration smoke
on:
  push:
    branches: [main, feature/full-legacy-migration]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  full-ui-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pending Supabase hardening migration safety
        run: node tests/security-migration-safety.cjs
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Full UI browser smoke
        run: |
          python3 -m http.server 8765 > /tmp/full-ui-server.log 2>&1 &
          sleep 2
          node scripts/smoke-full-ui.cjs
          node tests/account-pages-snapshot-sync.cjs
          node tests/daily-history-supabase-hydration.cjs
          node tests/daily-concurrent-conflict-regression.cjs
          node tests/snapshot-cas-proposal-safety.cjs
          node tests/snapshot-cas-contract-simulation.cjs
          node tests/weight-table-bridge.cjs
          node tests/workout-supabase-table.cjs
          node tests/workout-schedule-table-mirror.cjs
          node tests/workout-sync-noop-regression.cjs
          node tests/mobile-settings-insights-regression.cjs
