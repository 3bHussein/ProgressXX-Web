name: Full ProgressXX migration smoke
on:
  push:
    branches: [main, feature/full-legacy-migration]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  full-ui-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pending Supabase hardening migration safety
        run: node tests/security-migration-safety.cjs
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Full UI browser smoke
        run: |
          python3 -m http.server 8765 > /tmp/full-ui-server.log 2>&1 &
          sleep 2
          failed=0
          for test_file in \
            scripts/smoke-full-ui.cjs \
            tests/auth-retry-browser.cjs \
            tests/auth-refresh-singleflight.cjs \
            tests/auth-refresh-browser-concurrency.cjs \
            tests/account-pages-snapshot-sync.cjs \
            tests/daily-history-supabase-hydration.cjs \
            tests/daily-concurrent-conflict-regression.cjs \
            tests/cross-device-delete-resurrection-regression.cjs \
            tests/cross-device-safe-rebase-simulation.cjs \
            tests/sync-delete-resolution-api-contract.cjs \
            tests/offline-delete-replay-contract.cjs \
            tests/offline-same-record-conflict-contract.cjs \
            tests/offline-reconnect-browser-contract.cjs \
            tests/production-pending-snapshot-contract.cjs \
            tests/two-account-pending-isolation-contract.cjs \
            tests/full-app-two-account-isolation-browser.cjs \
            tests/offline-upload-failure-reload-browser.cjs \
            tests/production-flush-failure-retry-contract.cjs \
            tests/production-flush-chromium-contract.cjs \
            tests/full-app-sync-503-reload-browser.cjs \
            tests/two-context-pending-recovery-browser.cjs \
            tests/daily-alarm-dismiss-accessibility.cjs \
            tests/full-app-two-device-daily-resurrection.cjs \
            tests/production-sync-retry-backoff.cjs \
            tests/snapshot-cas-proposal-safety.cjs \
            tests/snapshot-cas-contract-simulation.cjs \
            tests/daily-conflict-prototype-safety.cjs \
            tests/daily-conflict-mobile-browser.cjs \
            tests/sync-delete-conflict-preview-browser.cjs \
            tests/weight-table-bridge.cjs \
            tests/workout-supabase-table.cjs \
            tests/workout-schedule-table-mirror.cjs \
            tests/workout-sync-noop-regression.cjs \
            tests/mobile-settings-insights-regression.cjs; do
            echo "::group::Run ${test_file}"
            if node "$test_file"; then
              echo "PASS: ${test_file}"
            else
              echo "::error file=${test_file}::FAIL: ${test_file}"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
