name: Full ProgressXX migration smoke
on:
  push:
    branches: [main, feature/full-legacy-migration]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  full-ui-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify database experiments remain paused
        run: node tests/database-experiments-paused.cjs
      - name: Verify pending Supabase hardening migration safety
        run: node tests/security-migration-safety.cjs
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Full UI browser smoke
        run: |
          python3 -m http.server 8765 > /tmp/full-ui-server.log 2>&1 &
          sleep 2
          failed=0
          failed_tests=()
          for test_file in \
            tests/v3-mobile-diary-browser.cjs \
            tests/v3-backup-restore-runtime.cjs \
            tests/backup-download-import-browser.cjs \
            tests/ui-language-catalogue.cjs \
            tests/settings-language-pages-browser.cjs \
            tests/graphite-mint-browser.cjs \
            tests/searchable-choice-picker-browser.cjs \
            tests/routine-builder-browser.cjs \
            tests/training-day-manager-browser.cjs \
            tests/food-portions-after-refresh-browser.cjs \
            tests/logout-dialog-policy-browser.cjs \
            tests/release-version-changelog.cjs \
            tests/navigation-current-page-browser.cjs \
            tests/insights-anatomy-controls-browser.cjs \
            tests/insights-panel-recovery-browser.cjs \
            tests/diagnostics-redaction-browser.cjs \
            tests/food-priority-collapse-browser.cjs \
            tests/food-weight-browsing-browser.cjs \
            tests/mobile-all-pages-design-browser.cjs \
            tests/weekly-weight-usual-foods-browser.cjs \
            tests/food-workflow-tools-browser.cjs \
            tests/food-undo-save-status-browser.cjs \
            tests/practical-weekly-progress-browser.cjs \
            tests/session-drafts-repeat-meals-browser.cjs \
            tests/home-action-hub-browser.cjs \
            tests/simple-insights-coaching-browser.cjs \
            tests/compact-food-navigation-browser.cjs \
            tests/daily-progress-focus-browser.cjs \
            tests/insights-evidence-actions-browser.cjs \
            tests/release-ci-workflow-contract.cjs \
            tests/release-ci-gate.cjs \
            scripts/smoke-full-ui.cjs \
            tests/login-imported-archive-regression.cjs \
            tests/locked-workspace-refresh-browser.cjs \
            tests/mobile-motion-anatomy-accessibility.cjs \
            tests/mobile-barcode-keyboard-rtl-browser.cjs \
            tests/workout-log-keyboard-browser.cjs \
            tests/workout-chronology-deload-contract.cjs \
            tests/v3-structured-session-contract.cjs \
            tests/session-mixed-performance-browser.cjs \
            tests/workout-log-incremental-browser.cjs \
            tests/barcode-lazy-library-browser.cjs \
            tests/pwa-shell-cache-contract.cjs \
            tests/pwa-offline-shell-browser.cjs \
            tests/pwa-install-permission-recovery-browser.cjs \
            tests/pwa-update-failure-browser.cjs \
            tests/auth-retry-browser.cjs \
            tests/auth-refresh-singleflight.cjs \
            tests/auth-refresh-browser-concurrency.cjs \
            tests/account-pages-snapshot-sync.cjs \
            tests/daily-history-supabase-hydration.cjs \
            tests/daily-concurrent-conflict-regression.cjs \
            tests/cross-device-delete-resurrection-regression.cjs \
            tests/cross-device-safe-rebase-simulation.cjs \
            tests/sync-delete-resolution-api-contract.cjs \
            tests/offline-delete-replay-contract.cjs \
            tests/offline-same-record-conflict-contract.cjs \
            tests/offline-reconnect-browser-contract.cjs \
            tests/production-pending-snapshot-contract.cjs \
            tests/two-account-pending-isolation-contract.cjs \
            tests/production-stale-snapshot-release-gate.cjs \
            tests/live-sync-release-classifier.cjs \
            tests/sync-commercial-release-gate.cjs \
            tests/backup-integrity-contract.cjs \
            tests/backup-offline-restore-rehearsal.cjs \
            tests/live-snapshot-preflight-contract.cjs \
            tests/live-snapshot-runtime-regression.cjs \
            tests/live-conflict-draft-export-contract.cjs \
            tests/live-conflict-review-contract.cjs \
            tests/live-conflict-pair-export-contract.cjs \
            tests/versioned-cas-reference-contract.cjs \
            tests/snapshot-cas-transition-contract.cjs \
            tests/cas-delete-unrelated-edit-acceptance.cjs \
            tests/cas-concurrency-matrix.cjs \
            tests/snapshot-conflict-guard-contract.cjs \
            tests/snapshot-conflict-guard-reload-contract.cjs \
            tests/conflict-review-queue-contract.cjs \
            tests/conflict-boundary-contract.cjs \
            tests/conflict-review-prototype-browser.cjs \
            tests/full-app-two-account-isolation-browser.cjs \
            tests/offline-upload-failure-reload-browser.cjs \
            tests/production-flush-failure-retry-contract.cjs \
            tests/production-flush-chromium-contract.cjs \
            tests/full-app-sync-503-reload-browser.cjs \
            tests/two-context-pending-recovery-browser.cjs \
            tests/daily-alarm-dismiss-accessibility.cjs \
            tests/daily-alarm-tab-focus-browser.cjs \
            tests/full-app-daily-alarm-keyboard-browser.cjs \
            tests/full-app-two-device-daily-resurrection.cjs \
            tests/production-sync-retry-backoff.cjs \
            tests/snapshot-cas-proposal-safety.cjs \
            tests/snapshot-cas-contract-simulation.cjs \
            tests/daily-conflict-prototype-safety.cjs \
            tests/daily-conflict-mobile-browser.cjs \
            tests/sync-delete-conflict-preview-browser.cjs \
            tests/weight-table-bridge.cjs \
            tests/workout-supabase-table.cjs \
            tests/workout-schedule-table-mirror.cjs \
            tests/workout-sync-noop-regression.cjs \
            tests/mobile-settings-insights-regression.cjs; do
            echo "::group::Run ${test_file}"
            if node "$test_file" > /tmp/px-current-test.log 2>&1; then
              cat /tmp/px-current-test.log
              echo "PASS: ${test_file}"
            else
              cat /tmp/px-current-test.log
              mkdir -p ci-failure-logs
              cp /tmp/px-current-test.log "ci-failure-logs/$(basename "$test_file").log"

              echo "::error file=${test_file}::FAIL: ${test_file}"
              failed_tests+=("${test_file}")
              failed=1
            fi
            echo "::endgroup::"
          done
          {
            echo "## Full UI smoke results"
            if [ "${#failed_tests[@]}" -eq 0 ]; then
              echo "All Full UI smoke tests passed."
            else
              echo "### Failed tests (${#failed_tests[@]})"
              for test_file in "${failed_tests[@]}"; do
                echo "- \`${test_file}\`"
              done
              echo "Open the **Full UI browser smoke** step and expand the matching test group for the assertion and stack trace."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${#failed_tests[@]}" -gt 0 ]; then
            printf 'FAILED TESTS: %s\\n' "${failed_tests[@]}" >&2
          fi
          exit "$failed"
      - name: Upload failed test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-ui-failed-test-logs
          path: ci-failure-logs/
          if-no-files-found: ignore
          retention-days: 7
