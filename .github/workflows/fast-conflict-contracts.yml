name: Fast conflict safety contracts
on:
  push:
    branches: [main]
    paths:
      - tests/daily-progress-focus-browser.cjs
      - tests/insights-evidence-actions-browser.cjs
      - tests/food-workflow-tools-browser.cjs
      - tests/food-weight-browsing-browser.cjs
      - tests/food-priority-collapse-browser.cjs
      - tests/v3-mobile-diary-browser.cjs
      - tests/release-ci-workflow-contract.cjs
      - 'tests/login-imported-archive-regression.cjs'
      - 'tests/login-optional-render-recovery.cjs'
      - 'scripts/smoke-full-ui.cjs'
      - '.github/workflows/deploy-pages.yml'
      - 'icon-512.svg'
      - 'icon-192.svg'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'commercial-v1.html'
      - 'full-app.html'
      - 'tests/release-ci-gate.cjs'
      - 'scripts/release-ci-gate.cjs'
      - 'scripts/conflict-*.cjs'
      - 'scripts/versioned-cas-reference.cjs'
      - 'scripts/snapshot-conflict-guard.cjs'
      - 'scripts/conflict-review-queue.cjs'
      - 'index.html'
      - 'tests/snapshot-*.cjs'
      - 'tests/live-sync-release-classifier.cjs'
      - 'tests/sync-commercial-release-gate.cjs'
      - 'tests/*cas*.cjs'
      - 'tests/*conflict*.cjs'
      - '.github/workflows/fast-conflict-contracts.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  conflict-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated contracts and production risk classifier
        run: |
          set -eu
          node tests/release-ci-workflow-contract.cjs
          node tests/release-ci-gate.cjs
          node tests/cas-concurrency-matrix.cjs
          node tests/cas-delete-unrelated-edit-acceptance.cjs
          node tests/snapshot-conflict-guard-contract.cjs
          node tests/snapshot-conflict-guard-reload-contract.cjs
          node tests/conflict-review-queue-contract.cjs
          node tests/conflict-boundary-contract.cjs
          node tests/versioned-cas-reference-contract.cjs
          node tests/live-snapshot-runtime-regression.cjs
          node tests/live-sync-release-classifier.cjs
          node tests/sync-commercial-release-gate.cjs
          echo 'Fast contracts complete; production CAS remains NOT DEPLOYED'
